<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Excel Search - Popup</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="search-core.js"></script>
  <script src="dialog.js" defer></script>
</head>
<body class="dialog-page">
  <header class="app-header">
    <div class="brand">
      <div class="app-symbol" aria-hidden="true">⌕</div>
      <div>
        <h1>Excel Search <span class="version">POC 0.1</span></h1>
        <div id="connectionLabel" class="app-subtitle">Officeとの接続を確立中…</div>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" id="refreshSheetList" class="secondary small-button" title="シート一覧を再取得">↻ シート一覧</button>
      <button type="button" id="closeDialog" class="quiet small-button" title="ポップアップを閉じる">閉じる ×</button>
    </div>
  </header>

  <section class="source-bar" aria-label="読み込み範囲の設定">
    <div class="source-heading">
      <strong>読み込み対象</strong>
      <span class="muted small">現在のブックの表示シートのみ／最大5シート</span>
    </div>
    <div id="sheetChecks" class="sheet-checks" role="group" aria-label="シート選択"><span class="muted">取得中…</span></div>
    <div class="source-footer">
      <button type="button" id="loadSheets" disabled>選択したシートを読み込む</button>
      <label class="check-label"><input id="skipHeader" type="checkbox" checked /> 各シートの先頭行を見出しとして扱う</label>
      <span id="loadSummary" class="muted small"></span>
    </div>
  </section>

  <section class="search-panel" aria-label="検索条件">
    <div class="search-row">
      <label class="sr-only" for="searchInput">検索語句</label>
      <span class="magnifier" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" autocomplete="off" placeholder="文字を入力して検索（入力と同時に絞り込み）" spellcheck="false" />
      <button id="clearSearch" class="quiet small-button" type="button">クリア</button>
    </div>
    <div class="options-row">
      <label class="check-label"><input id="regexMode" type="checkbox" /> 正規表現</label>
      <label class="check-label"><input id="caseSensitive" type="checkbox" /> 大文字小文字を区別</label>
      <label class="column-label" for="columnFilter">対象列 <input id="columnFilter" type="text" maxlength="80" placeholder="全列 / A,C" aria-label="検索対象列。全列またはA,Cの形式" /></label>
      <span class="muted small">1行内のいずれかのセルに一致</span>
    </div>
  </section>

  <div id="notice" class="status-line" role="status" aria-live="polite">ブックのシート一覧を待っています…</div>
  <div id="warning" class="warning-line" hidden role="alert"></div>

  <section class="results-section" aria-label="検索結果">
    <div class="results-toolbar">
      <div>
        <strong id="resultCount">検索結果</strong>
        <span id="resultDescription" class="muted small">未読み込み</span>
      </div>
      <div class="results-actions">
        <button id="copyCell" type="button" class="secondary small-button" disabled>選択セルをコピー</button>
        <button id="copyTsv" type="button" class="secondary small-button" disabled>表示結果をTSVコピー</button>
      </div>
    </div>
    <div id="tableScroller" class="table-scroller">
      <table id="resultsTable">
        <thead id="resultsHead"></thead>
        <tbody id="resultsBody"><tr><td class="empty-placeholder">データを読み込むと、ここに検索結果が表示されます。</td></tr></tbody>
      </table>
    </div>
  </section>
  <footer class="app-footer"><span>セルをクリックするとExcelの該当セルへ移動します。</span><span id="selectionStatus"></span></footer>
</body>
</html>
