<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Excel Search - Host Controller</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="host.js" defer></script>
</head>
<body class="host-page">
  <main class="host-card">
    <div class="eyebrow">Excel Search / Office.js</div>
    <h1>検索ウィンドウの診断</h1>
    <p>通常は［ホーム］→［検索ポップアップ］から開きます。この画面は、ポップアップ起動がうまくいかない場合の診断用です。</p>
    <div id="hostStatus" class="notice" role="status">Officeランタイムに接続中…</div>
    <div class="host-buttons">
      <button type="button" id="openPopup">ポップアップを開く</button>
      <button type="button" id="resetPopup" class="secondary">開き直す</button>
      <button type="button" id="hidePane" class="secondary">このペインを隠す</button>
    </div>
    <h2>最近のログ</h2>
    <pre id="diagnosticLog" class="diagnostic-log" aria-live="polite"></pre>
    <p class="small muted">Excelブックのデータはこのアドインの実行コンテキスト内でのみ処理します。外部APIへの送信処理はありません。</p>
  </main>
</body>
</html>
